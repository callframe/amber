[workspace]
members = ["crates/amber"]
resolver = "3"

[workspace.package]
description = "The Programming Language compiled to Shell."
version = "0.7.0"
edition = "2024"
repository = "https://github.com/amber-lang/Amber"

[workspace.dependencies]
# MiMalloc is a general-purpose allocator that generally outperforms libc's malloc.
# Jemalloc is also worth considering, but doesn't support MSVC targets, so we use MiMalloc instead.
mimalloc = { version = "0.1.52", features = ["override"] }

clap = { version = "4.6.6" }
